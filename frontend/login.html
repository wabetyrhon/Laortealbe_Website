<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login | Laortealbe Meat Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
  <style>
    :root{--bg:#f5faf8;--surface:#fff;--surface2:#e6f1ee;--line:#d5e3de;--text:#14231c;--muted:#5b7068;--ice:#1f6b4f;--ink:#fff;--bad:#c0392b;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif;line-height:1.55}
    h1{font-family:'Bricolage Grotesque',sans-serif;font-size:1.7rem;line-height:1.1;letter-spacing:-.01em;text-align:center;margin:0 0 20px}
    .hidden{display:none!important}
    :focus-visible{outline:3px solid var(--ice);outline-offset:2px}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px;box-shadow:0 1px 3px rgba(20,35,28,.08)}
    .logo{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 22px}
    label{display:block;margin:0 0 4px;font-weight:500}
    input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
    input[aria-invalid=true]{border-color:var(--bad)}
    .pw-row{display:flex;gap:8px}
    .pw-row input{flex:1}
    .btn{background:var(--ice);color:var(--ink);border:0;border-radius:99px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
    .btn:hover{background:#185a42}
    .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--muted);padding:5px 14px;font-size:.9rem}
    .btn.ghost:hover{background:var(--surface2)}
    .btn.full{width:100%;margin-top:18px;padding:12px 20px}
    .login-error{background:#fdecea;border:1px solid #e5b4ad;color:#8a2a20;border-radius:12px;padding:10px 14px;margin-bottom:14px}
    .back{display:block;text-align:center;margin-top:18px;color:var(--ice)}
  </style>
</head>
<body>

<div class="login-wrap">
  <main class="login-card">
    <img class="logo" src="/logo.png" alt="Laortealbe, fresh and cheap">
    <h1>Admin access</h1>

    <div id="error-message" class="login-error hidden" role="alert">Wrong password. Please try again.</div>

    <form action="/login" method="POST">
      <label for="password">Password</label>
      <div class="pw-row">
        <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
        <button id="toggle-pw" class="btn ghost" type="button" aria-pressed="false">Show</button>
      </div>
      <button class="btn full" type="submit">Log in</button>
    </form>

    <a class="back" href="/">Back to the shop</a>
  </main>
</div>

<script type="mpy">
from pyscript import document, window, when

# Flask sends the user back to /login?error=1 after a wrong password
params = window.URLSearchParams.new(window.location.search)
if params.has("error"):
    document.querySelector("#error-message").classList.remove("hidden")
    document.querySelector("#password").setAttribute("aria-invalid", "true")
    window.history.replaceState(None, "", "/login")  # a refresh will not show the error again


@when("click", "#toggle-pw")
def on_toggle(event):
    box = document.querySelector("#password")
    btn = document.querySelector("#toggle-pw")
    showing = box.type == "text"
    box.type = "password" if showing else "text"
    btn.innerText = "Show" if showing else "Hide"
    btn.setAttribute("aria-pressed", "false" if showing else "true")
    box.focus()
</script>

</body>
</html>
